# Continuous write-ahead-log archiving for Frontier's database.
# Append to postgresql.conf (e.g. /etc/postgresql/16/main/conf.d/frontier-wal.conf), create the
# archive folder owned by postgres, then restart PostgreSQL:
#   sudo install -d -o postgres -g postgres -m 700 /var/backups/frontier/wal
#   sudo systemctl restart postgresql
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/backups/frontier/wal/%f && cp %p /var/backups/frontier/wal/%f'
archive_timeout = 300
# Point-in-time recovery: restore the latest base backup (scripts/backup.sh --base), then set
#   restore_command = 'cp /var/backups/frontier/wal/%f %p'
# and create recovery.signal in the data directory. See the PostgreSQL manual, "Continuous Archiving".
