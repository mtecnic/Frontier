# Add this inside your site's existing `server { ... }` block when the game's files sit in a
# subfolder of a static site, e.g. waive.online/static/frontier/ (adjust both paths if yours
# differ). Your existing config keeps serving the files; this only forwards the game's API
# calls to the Node process. Then: sudo nginx -t && sudo systemctl reload nginx
location /static/frontier/api/ {
    proxy_pass http://127.0.0.1:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}
