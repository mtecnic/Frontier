# nginx site for Frontier. The client is a static folder; /api/ goes to the Node process.
# Replace frontier.example.com and the paths, then:  sudo certbot --nginx -d frontier.example.com
server {
    listen 80;
    listen [::]:80;
    server_name frontier.example.com;

    # The built client (npm run build -> public/). Copy it here, or point root at the repo's public/.
    root /var/www/frontier/public;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (don't append to) whatever the client sent, so rate limits see the real address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    # Always revalidate the shell so new builds show up; vendor files and icons can cache longer.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /config.js { add_header Cache-Control "no-cache"; }
    location /vendor/ { add_header Cache-Control "public, max-age=86400"; }
    location /icons/ { add_header Cache-Control "public, max-age=86400"; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Permissions-Policy "geolocation=(self)";
    }

}
