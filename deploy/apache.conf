# Apache vhost for Frontier. Needs: a2enmod proxy proxy_http headers rewrite
# Replace frontier.example.com and the paths; use certbot --apache for HTTPS.
<VirtualHost *:80>
    ServerName frontier.example.com
    DocumentRoot /var/www/frontier/public

    <Directory /var/www/frontier/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8787/api/
    ProxyPassReverse /api/ http://127.0.0.1:8787/api/
    RequestHeader set X-Forwarded-Proto "https" env=HTTPS
    # Overwrite any client-supplied value so rate limits see the real address.
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    AddType application/manifest+json .webmanifest
    AddType text/javascript .mjs

    <FilesMatch "^(index\.html|sw\.js|config\.js)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    Header always set X-Content-Type-Options nosniff
</VirtualHost>
